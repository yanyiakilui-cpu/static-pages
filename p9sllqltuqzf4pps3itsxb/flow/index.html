<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="application-name" content="Flow">
<meta name="description" content="Flow: a private, offline period and cycle tracker.">
<title>Flow · Period Tracker</title>

<style>
:root{
  --bg:#ffffff; --card:#ffffff; --ink:#1f1a1d; --muted:#6b6168; --line:#f0e4e9;
  /* Flo-style coral + teal. --plum = accessible coral for text/buttons, --period = Flo coral for circles */
  --plum:#C92F58; --plum-2:#B4264D; --rose:#D13760; --rose-soft:#FDE8EE; --rose-mid:#F7B6C6;
  --period:#F25C7A; --pred:#FDE4EA; --pred-ink:#C92F58; --fert:#E3F4F4; --fert-ink:#16807F; --ovu:#2BA5A5;
  --warn-bg:#fff4e5; --warn-ink:#7a4a00; --ok-bg:#eaf6f0; --ok-ink:#1f6146; --info-bg:#f1ecf7; --info-ink:#4b3570;
  --radius:20px; --shadow:0 2px 10px rgba(242,92,122,.07), 0 1px 2px rgba(31,26,29,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(96px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:1.45rem;color:var(--plum);letter-spacing:-.01em}
.brand svg{width:32px;height:32px}
.today-lbl{color:var(--muted);font-size:.9rem}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;border:1px solid var(--line)}
.card h2{font-size:1.02rem;margin:0 0 10px;color:var(--plum)}
.card h3{font-size:.95rem;margin:0 0 4px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--info-bg);color:var(--info-ink);vertical-align:middle}
.tag.fert{background:var(--fert);color:var(--fert-ink)}
/* hero */
.hero{background:linear-gradient(160deg,#fff 0%,#fff3f6 100%);text-align:center;padding:22px 18px 18px}
.ring{position:relative;width:220px;height:220px;margin:0 auto 6px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 26px}
.ring .k{font-size:.82rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.ring .big{font-size:2.5rem;font-weight:800;color:var(--ink);line-height:1.1}
.ring .sub{font-size:.95rem;color:var(--ink);margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-weight:650;min-height:48px;transition:transform .08s ease, background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--rose);color:#fff}
.btn.primary:hover{background:var(--plum-2)}
.btn.rose{background:var(--rose);color:#fff}
.btn.soft{background:var(--rose-soft);color:var(--plum)}
.btn.ghost{background:transparent;color:var(--plum);border:1.5px solid var(--rose-mid)}
.btn.danger{background:#fde8ea;color:#9b1c2e}
.btn.block{width:100%}
.btn-row{display:flex;gap:10px;margin-top:12px}
.btn-row .btn{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.stat .v{font-size:1.45rem;font-weight:800;color:var(--plum)}
.stat .v small{font-size:.8rem;font-weight:600;color:var(--muted)}
.stat .l{font-size:.8rem;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.note{border-radius:16px;padding:14px 14px;margin-bottom:10px;font-size:.93rem}
.note h3{margin:0 0 4px;font-size:.98rem}
.note.warn{background:var(--warn-bg);color:var(--warn-ink)}
.note.ok{background:var(--ok-bg);color:var(--ok-ink)}
.note.info{background:var(--info-bg);color:var(--info-ink)}
.disclaimer{font-size:.82rem;color:var(--muted);margin-top:8px}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .inner{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--muted);font-size:.72rem;font-weight:600;border-radius:12px;min-height:52px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--plum);background:var(--rose-soft)}
.view{display:none}
.view.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* calendar */
body.cal-on header.top{display:none}
body.cal-on .app{padding-top:0}
.cal-top{position:sticky;top:0;z-index:15;background:#fff;margin:0 -16px;padding:calc(env(safe-area-inset-top) + 6px) 16px 0;border-bottom:1px solid var(--line)}
.cal-bar{display:flex;align-items:center;justify-content:space-between;height:54px}
.xbtn{width:44px;height:44px;border:0;background:none;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);border-radius:12px;padding:0}
.xbtn svg{width:26px;height:26px}
.seg2{display:inline-flex;background:#eee8eb;border-radius:13px;padding:3px}
.seg2 button{border:0;background:none;border-radius:10px;padding:6px 22px;font-weight:700;color:#7a7076;min-height:36px}
.seg2 button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);font-size:.74rem;color:var(--muted);text-align:center;font-weight:600;padding:0 0 5px}
.edit-hint{background:var(--rose-soft);color:var(--plum);font-size:.86rem;text-align:center;padding:7px;border-radius:10px;margin-bottom:6px;font-weight:600}
.mon{padding:14px 0 10px;border-bottom:1px solid var(--line)}
.mon:last-of-type{border-bottom:0}
.mon h3{text-align:center;font-size:1.2rem;font-weight:800;margin:4px 0 18px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:32px}
.d{position:relative;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;height:48px;color:var(--ink)}
.d .c{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.17rem;font-weight:500;border:2px solid transparent}
.d .tl{position:absolute;top:-11px;line-height:1;left:0;right:0;text-align:center;font-size:.64rem;font-weight:800;letter-spacing:.04em;color:var(--ink)}
.d.today .c{font-weight:800}
.d.period .c{background:var(--period);color:#fff;font-weight:700}
.d.pred .c{background:var(--pred);color:var(--pred-ink);font-weight:600}
.d.predtail .c{background:var(--pred);border:2px dotted var(--period);color:var(--pred-ink);font-weight:600}
.d.fert .c{color:var(--fert-ink);font-weight:600}
.d.ovu .c{border:2px dotted var(--ovu);color:var(--fert-ink);font-weight:700}
.d.edit .c{border:2px solid #e9dfe4}
.d.edit.sel .c{background:var(--period);border-color:var(--period);color:#fff;font-weight:700}
.d.edit.future{opacity:.35}
.d:disabled{cursor:default}
.cal-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:.74rem;color:var(--muted);padding:16px 0 2px}
.cal-legend span{display:inline-flex;align-items:center;gap:5px}
.cal-note{font-size:.74rem;color:var(--muted);text-align:center;margin:4px 0 0}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block;box-sizing:border-box}
.pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));background:var(--rose);color:#fff;border:0;border-radius:999px;padding:10px 24px;font-weight:700;font-size:.95rem;box-shadow:0 4px 14px rgba(209,55,96,.35);z-index:18;min-height:44px;white-space:nowrap}
.edit-bar{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;z-index:18;padding:0 16px}
.edit-bar .btn{min-width:130px;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.edit-bar .btn.soft{background:#fff;border:1.5px solid var(--rose-mid)}
.more{display:block;margin:8px auto 0;background:none;border:0;color:var(--plum);font-weight:600;padding:10px;min-height:44px}
.ynav{display:flex;align-items:center;justify-content:center;gap:18px;padding:12px 0 4px}
.ynav b{font-size:1.25rem}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--plum);display:inline-flex;align-items:center;justify-content:center;font-size:1.3rem}
.ygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 10px;padding:10px 0}
@media(min-width:520px){.ygrid{grid-template-columns:repeat(4,1fr)}}
.ym{background:none;border:0;padding:4px;text-align:left;border-radius:12px;color:var(--ink)}
.ym h4{margin:0 0 4px 2px;font-size:.92rem;font-weight:800}
.ym.cur h4{color:var(--plum)}
.yg{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.yg span{font-size:.58rem;height:15px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.yg .period{background:var(--period);color:#fff;font-weight:700}
.yg .pred,.yg .predtail{background:var(--pred);color:var(--pred-ink)}
.yg .fert{color:var(--fert-ink);font-weight:700}
.yg .ovu{color:var(--fert-ink);font-weight:800;box-shadow:inset 0 0 0 1px var(--ovu)}
.yg .today{font-weight:900;text-decoration:underline}
/* history */
.hist-item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.hist-item .d{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:.8rem;background:var(--rose-soft);color:var(--plum);padding:3px 10px;border-radius:999px}
.flowdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--period);margin-right:2px;vertical-align:middle}
.flowdot.off{background:var(--rose-mid);opacity:.45}
/* bars */
.bar-row{display:grid;grid-template-columns:92px 1fr 44px;gap:8px;align-items:center;margin:8px 0;font-size:.86rem}
.bar{height:12px;border-radius:99px;background:var(--rose-soft);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--rose-mid),var(--rose))}
.bar i.flag{background:linear-gradient(90deg,#f3c98b,#c77d10)}
/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(40,15,35,.38);display:none;align-items:flex-end;justify-content:center;z-index:50}
.backdrop.open{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .2s ease}
@media(min-width:600px){.backdrop{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 14px;color:var(--plum);font-size:1.2rem}
label.f{display:block;font-weight:650;font-size:.9rem;margin:12px 0 6px}
input[type=date],textarea,input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;min-height:46px}
input[type=date]:focus,textarea:focus{border-color:var(--rose);outline:none}
textarea{min-height:80px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.95rem}
.check input{width:22px;height:22px;accent-color:var(--plum)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button,.symp button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;min-height:40px;font-size:.9rem}
.seg button[aria-pressed="true"],.symp button[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:#fff}
.symp{display:flex;gap:8px;flex-wrap:wrap}
.err{color:#9b1c2e;font-size:.9rem;margin-top:10px;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:.92rem;opacity:0;pointer-events:none;transition:all .2s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.list-actions{display:flex;flex-direction:column;gap:10px}
a{color:var(--rose)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#F25C7A"/><path d="M32 12C32 12 18 28 18 38a14 14 0 0 0 28 0C46 28 32 12 32 12z" fill="#fff"/><circle cx="27" cy="38" r="4" fill="#F25C7A" opacity=".35"/></svg>
      <span>Flow</span>
    </div>
    <div class="today-lbl" id="todayLbl"></div>
  </header>

  <main>
    <section class="view active" id="view-home" aria-label="Today"></section>
    <section class="view" id="view-calendar" aria-label="Calendar"></section>
    <section class="view" id="view-history" aria-label="History"></section>
    <section class="view" id="view-insights" aria-label="Insights"></section>
    <section class="view" id="view-data" aria-label="Data and settings"></section>
  </main>
</div>

<nav class="tabs" aria-label="Main">
  <div class="inner" role="tablist">
    <button role="tab" data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s-6 7-6 11a6 6 0 0 0 12 0c0-4-6-11-6-11z"/></svg>Today</button>
    <button role="tab" data-tab="calendar" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
    <button role="tab" data-tab="history" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>History</button>
    <button role="tab" data-tab="insights" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Insights</button>
    <button role="tab" data-tab="data" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Data</button>
  </div>
</nav>

<div class="backdrop" id="sheetWrap" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet" id="sheet"></div>
</div>
<div id="calFloat"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="flow-core">
/* ===== Core cycle logic (pure, testable; no DOM) ===== */
var FlowCore = (function () {
  var DAY = 86400000;
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function toNum(s) { var p = s.split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / DAY); }
  function toStr(n) { return new Date(n * DAY).toISOString().slice(0, 10); }
  function addDays(s, k) { return toStr(toNum(s) + k); }
  function diff(a, b) { return toNum(a) - toNum(b); } // a - b in days
  function localToday() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function isDate(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && toStr(toNum(s)) === s; }
  function mean(a) { return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : null; }
  function sd(a) { if (a.length < 2) return null; var m = mean(a); return Math.sqrt(mean(a.map(function (x) { return (x - m) * (x - m); }))); }
  function sortPeriods(ps) { return ps.slice().sort(function (a, b) { return toNum(a.start) - toNum(b.start); }); }

  var DEFAULT_CYCLE = 28, DEFAULT_PERIOD = 5, LUTEAL = 14, MAX_RECENT = 6, PRED_CYCLES = 3;
  var SHORT = 21, LONG = 35, LONG_PERIOD = 7, IRREG_VAR = 7, LATE_DAYS = 7;

  // Effective end of a period for display/overlap. Last period w/o end = ongoing (to today).
  // Earlier periods w/o end = end not logged (treated as start day only).
  function effEnd(p, isLast, today) {
    if (p.end) return p.end;
    if (isLast) return toNum(today) >= toNum(p.start) ? today : p.start;
    return p.start;
  }
  function duration(p) { return p.end ? diff(p.end, p.start) + 1 : null; }

  function analyze(periods, today) {
    today = today || localToday();
    var t = toNum(today);
    var ps = sortPeriods(periods || []);
    var n = ps.length;
    var cycles = [];
    for (var i = 0; i < n - 1; i++) {
      cycles.push({ start: ps[i].start, nextStart: ps[i + 1].start, length: diff(ps[i + 1].start, ps[i].start), periodLength: duration(ps[i]) });
    }
    var recent = cycles.slice(-MAX_RECENT);
    var lens = recent.map(function (c) { return c.length; });
    var allLens = cycles.map(function (c) { return c.length; });
    var enough = n >= 2;
    var avgCycleRaw = enough ? mean(lens) : null;
    var avgCycle = enough ? Math.round(avgCycleRaw) : DEFAULT_CYCLE;
    var completedDur = ps.filter(function (p) { return p.end; }).map(duration).slice(-MAX_RECENT);
    var avgPeriodRaw = completedDur.length ? mean(completedDur) : null;
    var avgPeriod = completedDur.length ? Math.round(avgPeriodRaw) : DEFAULT_PERIOD;
    var variation = lens.length >= 2 ? Math.max.apply(null, lens) - Math.min.apply(null, lens) : null;

    var last = n ? ps[n - 1] : null;
    var ongoing = !!(last && !last.end && toNum(last.start) <= t);
    var res = {
      today: today, periods: ps, count: n, cycles: cycles, recentCycles: recent,
      enoughData: enough, avgCycleRaw: avgCycleRaw, avgCycle: avgCycle,
      avgPeriodRaw: avgPeriodRaw, avgPeriod: avgPeriod, periodSamples: completedDur.length,
      shortest: allLens.length ? Math.min.apply(null, allLens) : null,
      longest: allLens.length ? Math.max.apply(null, allLens) : null,
      variation: variation, stdDev: sd(lens),
      last: last, ongoing: ongoing, periodDay: ongoing ? t - toNum(last.start) + 1 : null,
      cycleDay: last ? t - toNum(last.start) + 1 : null,
      nextStart: null, daysUntil: null, lateBy: 0, ovulation: null, fertileStart: null, fertileEnd: null,
      fertileNow: false, projections: [], insights: [],
      // uncertain tail of predicted periods (dotted days): 3 by default, else ~1 SD of cycle length, clamped 2..5
      predTail: lens.length >= 3 ? Math.max(2, Math.min(5, Math.ceil(sd(lens)))) : 3,
      // estimated fertile windows for already-logged cycles (ovulation ~14 days before the next logged start)
      pastWindows: cycles.map(function (c) { var o = toNum(c.nextStart) - LUTEAL; return { ovulation: toStr(o), fertileStart: toStr(o - 5), fertileEnd: toStr(o + 1), after: c.start }; })
    };
    if (last) {

  function upsert(p) {

          var dsx = b.dataset.date; if (C.diff(dsx, t) > 0) break;
          editSet[dsx] = !editSet[dsx]; b.classList.toggle('sel', !!editSet[dsx]); b.setAttribute('aria-pressed', String(!!editSet[dsx]));
        } else dayAction(b.dataset.date);
        break;
      case 'startOn': closeSheet(); startOn(b.dataset.date); break;
      case 'endOn': { closeSheet(); var pp = byId(b.dataset.id); if (pp) endOn(pp, b.dataset.date); break; }
      case 'exportJson': if (!state.periods.length) { toast('Nothing to export yet'); break; } download('flow-backup-' + t + '.json', backupJson(), 'application/json'); toast('Backup downloaded'); break;
      case 'exportCsv': if (!state.periods.length) { toast('Nothing to export yet'); break; } download('flow-periods-' + t + '.csv', csv(), 'text/csv'); toast('CSV downloaded'); break;
      case 'copyJson':
        openSheet('<h2 id="sheetTitle">Backup text</h2><p class="muted small">Copy this and save it somewhere safe (e.g. a note or email to yourself). You can restore by saving it as a .json file and importing it.</p><textarea id="bkTxt" style="min-height:220px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem" readonly>' + esc(backupJson()) + '</textarea><div class="btn-row"><button class="btn primary" data-act="copyNow">Copy</button><button class="btn soft" data-act="close">Done</button></div>');
        break;
      case 'copyNow': {
        var ta = $('bkTxt'); ta.focus(); ta.select();
        var done = function () { toast('Copied'); };
        if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(ta.value).then(done, function () { document.execCommand('copy'); done(); });
        else { try { document.execCommand('copy'); done(); } catch (x) { toast('Select the text and copy it manually'); } }
        break;
      }
      case 'importJson': $('fileIn').click(); break;
      case 'importPaste': importPaste(); break;
      case 'clearAll':
        if (!state.periods.length) { toast('Nothing to clear'); break; }
        if (confirm('Delete ALL ' + pl(state.periods.length, 'period') + ' from this device? Consider exporting a backup first.') && confirm('Are you sure? This can\u2019t be undone.')) {
          state = { version: 1, periods: [] }; save(); render(); toast('All data cleared');
        }
        break;
    }
  });

  // refresh at midnight / when returning to the app
  document.addEventListener('visibilitychange', function () { if (!document.hidden) render(); });
  window.addEventListener('storage', function (e) { if (e.key === KEY) { state = load(); render(); } });

  render();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () {}); });
}
</script>

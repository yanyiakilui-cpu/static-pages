<style>
:root{
  --bg:#ffffff;--ink:#1f2a44;--muted:#6b7590;--line:#e3eaf4;
  --blue:#3a8ee6;--blue-d:#2b74c4;--blue-soft:#eaf2fd;--card:#f1f6fd;--card-2:#f6f9fe;
  --cal:#3a8ee6;--p:#5d6ff2;--c:#f4875f;--f:#1fbfa3;
  --warm:#e48a3c;--warm-soft:#fdf2e6;--danger:#d6514a;--danger-soft:#fcebea;--ok:#1d9e7e;
  --hero:linear-gradient(160deg,#e5effc 0%,#eef1fb 55%,#f9ebea 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","Noto Sans CJK JP",sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}
body.has-nav{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
.app{max-width:520px;margin:0 auto;padding:0 16px 24px}
.hero{background:var(--hero);margin:0 -16px 18px;padding:calc(14px + env(safe-area-inset-top)) 16px 18px;border-radius:0 0 30px 30px}
.page-title{font-size:32px;font-weight:750;letter-spacing:-.5px;margin:calc(18px + env(safe-area-inset-top)) 0 14px}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px}
.card.white{background:#fff;border:1px solid var(--line)}
.card.glass{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);box-shadow:0 2px 12px rgba(58,100,170,.06)}
h2{font-size:18px;margin:0 0 6px;font-weight:700}
h3{font-size:16px;margin:0 0 6px}
.muted{color:var(--muted)}.small{font-size:13.5px}.tiny{font-size:12px}
.center{text-align:center}
.spacer{height:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:11px 18px;background:#fff;color:var(--ink);font-weight:600;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:active{background:var(--blue-d)}
.btn-soft{background:var(--blue-soft);color:var(--blue-d)}
.btn-pill{background:rgba(255,255,255,.8);border:1px solid #dfe7f3;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-ghost{background:transparent;color:var(--blue-d);padding:8px 10px}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-block{width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-sm{padding:7px 14px;font-size:13.5px}
.btn-big{padding:15px 18px;font-size:16px}
input,select{font:inherit;color:var(--ink);background:#f5f8fd;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;width:100%;outline:none;min-width:0}
input:focus,select:focus{border-color:var(--blue);background:#fff}
label.field{display:block;margin-bottom:12px}
label.field>span,.lbl{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.seg{display:flex;background:#fff;border:1px solid #dfe7f3;border-radius:10px;padding:2px;gap:2px;margin-bottom:12px}
.seg button{flex:1;background:transparent;color:var(--ink);padding:8px 6px;border-radius:8px;font-size:14px;font-weight:500}
.seg button.on{background:var(--blue);color:#fff;font-weight:600}
.note{border-radius:14px;padding:10px 12px;font-size:13.5px;margin:10px 0;background:var(--blue-soft);color:#2a4f7c}
.note.warm{background:var(--warm-soft);color:#7a4a1c}
.ic{width:20px;height:20px;flex:0 0 auto}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .inner{display:flex;max-width:520px;width:100%}
nav.tabs button{flex:1;background:none;color:#a9b6cb;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:6px 0;font-weight:600;border-radius:12px}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button.on{color:var(--blue)}
/* diary */
.datenav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.datenav button.arrow{background:none;padding:6px 10px;color:var(--ink);font-size:24px;line-height:1}
.dlabel{position:relative;font-weight:600;font-size:17px}
.dlabel input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;padding:0;border:0}
.rings-card{display:flex;align-items:center;gap:14px;padding:16px 14px}
.rings{width:132px;height:132px;flex:0 0 132px}
.rings svg{width:100%;height:100%;transform:rotate(-90deg)}
.rtable{flex:1;display:grid;grid-template-columns:1fr auto auto;gap:7px 14px;align-items:center;font-size:14px}
.rtable .h{font-weight:700}
.rtable .v{font-weight:700;text-align:right}
.rtable .t{color:var(--muted);text-align:right}
.rtable .nm{display:flex;align-items:center;gap:8px}
.dot{width:7px;height:13px;border-radius:4px;display:inline-block}
.meal{padding:14px 2px 6px;border-bottom:1px solid var(--line)}
.meal:last-of-type{border-bottom:0}
.meal-head{display:flex;align-items:center;gap:6px}
.meal-head .mt{flex:1;min-width:0}
.meal-head .mt b{font-size:18px;font-weight:600;display:block}
.meal-head .mt span{color:var(--muted);font-size:13.5px}
.iconbtn{width:38px;height:38px;padding:0;border-radius:50%;display:grid;place-items:center;background:none;color:var(--ink)}
.plus{width:30px;height:30px;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;margin-left:4px}
.entries{background:var(--card);border-radius:16px;margin:10px 0 6px;overflow:hidden}
.entry{padding:12px 16px;cursor:pointer;border-top:1px solid #dbe5f3}
.entry:first-child{border-top:0}
.entry:active{background:#e6eefb}
.compact{position:fixed;top:0;left:0;right:0;z-index:15;transform:translateY(-110%);transition:transform .2s;pointer-events:none}
.compact.show{transform:none;pointer-events:auto}
.compact-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(240,245,253,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:calc(8px + env(safe-area-inset-top)) 8px 8px;border-bottom:1px solid var(--line);border-radius:0 0 18px 18px;box-shadow:0 4px 14px rgba(40,70,120,.08)}
.compact-in>div{text-align:center;border-left:1px solid #d9e3f2}
.compact-in>div:first-child{border:0}
.compact-in b{display:block;font-size:17px}
.compact-in span{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--blue-soft);color:var(--blue-d);vertical-align:1px}
.check-row{display:flex;gap:10px;align-items:center;font-size:14px;margin:2px 0 14px}
.check-row input{width:20px;height:20px;accent-color:var(--blue);flex:0 0 auto}
.nf{border:2px solid #1f2a44;border-radius:10px;padding:8px 12px 10px;background:#fff;margin:4px 0 12px;color:#111827}
.nf h3{font-size:28px;font-weight:900;margin:0;letter-spacing:-.6px;line-height:1.1;border-bottom:1px solid #1f2a44;padding-bottom:4px}
.nf .r{display:flex;align-items:center;gap:6px;border-top:1px solid #b9c3d3;padding:5px 0;min-height:36px}
.nf .r.first{border-top:0}
.nf .r.thick{border-top:9px solid #1f2a44;min-height:0;padding:3px 0}
.nf .r.med{border-top:4px solid #1f2a44;min-height:0}
.nf .r.small-t{font-size:12px;font-weight:700;justify-content:space-between}
.nf .r label{flex:1;font-weight:800;font-size:14px;min-width:0}
.nf .r.sub label{padding-left:16px;font-weight:500}
.nf .r.sub2 label{padding-left:32px;font-weight:500}
.nf input{width:78px;flex:0 0 78px;padding:6px 8px;text-align:right;border-radius:8px;font-size:15px;background:#f6f8fc}
.nf input.wide{width:auto;flex:1 1 55%;text-align:left}
.nf select{width:62px;flex:0 0 62px;padding:6px 6px;border-radius:8px;font-size:14px}
.nf .u{width:24px;flex:0 0 24px;color:var(--muted);font-size:12.5px}
.nf .dv{width:38px;flex:0 0 38px;text-align:right;font-weight:800;font-size:13px}
.nf .r.cal label{font-size:24px;font-weight:900}
.nf .r.cal input{width:104px;flex:0 0 104px;font-size:22px;font-weight:800}
.nf .foot{font-size:11px;color:#4b5563;border-top:4px solid #1f2a44;margin-top:4px;padding-top:6px}
.nrow{padding:9px 0;border-bottom:1px solid var(--line)}
.nrow .nl{display:flex;justify-content:space-between;gap:8px;font-size:14.5px;margin-bottom:5px}
.nbar{height:8px;border-radius:8px;background:#e3ebf6;overflow:hidden}
.nbar>i{display:block;height:100%;border-radius:8px}
.entry .en{font-weight:600}
.entry .ed{color:var(--muted);font-size:13px;margin-top:2px}
/* coach */
.coach-hero{text-align:center}
.coach-hero .goal-t{font-size:17px;font-weight:600;margin-top:18px}
.coach-hero .rate{font-size:34px;font-weight:750;margin:6px 0 14px;letter-spacing:-.5px}
.coach-hero .rate small{font-size:16px;font-weight:500;color:var(--muted)}
.progress{height:10px;border-radius:10px;background:#d8e5f7;overflow:hidden;margin:6px 6px 14px}
.progress>i{display:block;height:100%;background:var(--blue);border-radius:10px}
.sce{display:flex;justify-content:space-between;padding:0 6px;margin-bottom:16px}
.sce div{text-align:center}
.sce div:first-child{text-align:left}.sce div:last-child{text-align:right}
.sce b{font-size:16px}.sce b small{font-weight:500;color:var(--muted);font-size:14px}
.sce span{display:block;color:var(--muted);font-size:13.5px}
.two{display:flex;gap:10px}.two>button{flex:1}
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 0;margin:12px 0}
.macro-grid>div{text-align:center;border-left:1px solid var(--line)}
.macro-grid>div:first-child{border:0}
.macro-grid b{font-size:19px;display:flex;align-items:center;justify-content:center;gap:6px}
.macro-grid span{font-size:12.5px;color:var(--muted)}
.ctable{display:grid;grid-template-columns:1fr auto auto;gap:10px 18px;font-size:15px;margin-top:12px}
.ctable .hd{color:var(--muted);font-size:13.5px;font-weight:600}
.ctable .r{text-align:right}
.ctable b.in{color:var(--ok)}
.switch{position:relative;width:52px;height:30px;flex:0 0 52px}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch i{position:absolute;inset:0;background:#cfd9e8;border-radius:30px;transition:.2s;cursor:pointer}
.switch i:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+i{background:var(--blue)}
.switch input:checked+i:before{transform:translateX(22px)}
.flex{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
/* settings list */
.sec-t{color:var(--muted);font-size:14px;font-weight:500;margin:18px 4px 8px}
.group{background:var(--card);border-radius:20px;overflow:hidden;margin-bottom:6px}
.group button{width:100%;display:flex;align-items:center;gap:14px;background:none;border-radius:0;padding:16px 18px;border-bottom:1px solid var(--line);font-weight:500;text-align:left}
.group button:last-child{border-bottom:0}
.group button .gt{flex:1}
.group button .gi{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px}
/* sheets */
.backdrop{position:fixed;inset:0;background:rgba(20,30,60,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:#fff;border-radius:26px 26px 0 0;height:90vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);z-index:50;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -10px 40px rgba(0,0,0,.12)}
.sheet.auto{height:auto;max-height:90vh}
.sheet{visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s linear .26s}
.sheet.show{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s}
.grab{width:42px;height:5px;border-radius:5px;background:#d5deeb;margin:8px auto 2px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 12px 8px 18px}
.sheet-head h2{margin:0}
.sheet-body{overflow:auto;padding:4px 18px 20px;-webkit-overflow-scrolling:touch;flex:1}
.close{background:#eef3fa;color:var(--muted);width:34px;height:34px;padding:0;border-radius:50%;font-size:16px}
.list .item{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list .item:active{background:var(--card-2)}
.list .item .in{flex:1;min-width:0}
.list .item .in div:first-child{font-weight:600}
.list .item .k{font-weight:700;white-space:nowrap;text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.chip{padding:6px 12px;border-radius:99px;background:var(--blue-soft);color:var(--blue-d);font-size:13px;font-weight:600}
.chip.on{background:var(--blue);color:#fff}
.section-t{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin:14px 0 2px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:46px;height:46px;padding:0;font-size:22px;flex:0 0 46px;background:var(--blue-soft);color:var(--blue-d)}
.qty input{text-align:center;font-size:20px;font-weight:700}
.qty .unit{flex:0 0 auto;color:var(--muted);font-weight:600;min-width:52px}
.result{background:var(--card);border-radius:18px;padding:12px 14px;margin:14px 0}
.result .rk{font-size:26px;font-weight:750;color:var(--blue-d)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0}
.kv span:first-child{color:var(--muted)}
.radio{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:16px;margin-bottom:8px;cursor:pointer}
.radio.on{border-color:var(--blue);background:var(--blue-soft)}
.radio input{width:18px;height:18px;margin-top:2px;accent-color:var(--blue)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1f2a44;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:60;display:flex;gap:12px;align-items:center;max-width:92vw}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{background:none;color:#9cc8ff;padding:0 2px}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:11px;fill:#7c879f;font-family:inherit}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid3>div{background:#fff;border-radius:14px;padding:10px 4px}
.big-num{font-size:22px;font-weight:750}
.disclaimer{font-size:12px;color:var(--muted);text-align:center;padding:6px 10px 10px}
.hide{display:none!important}
@media (min-width:700px){
  .sheet{bottom:24px;border-radius:26px;height:min(780px,86vh)}
  .sheet.auto{height:auto}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs hide" id="nav"><div class="inner">
  <button data-tab="diary"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 2.5h11a2 2 0 0 1 2 2v15a2 2 0 0 1-2 2H6a1.5 1.5 0 0 1-1.5-1.5V4A1.5 1.5 0 0 1 6 2.5z" opacity=".9"/><rect x="8" y="6" width="7" height="2.2" rx="1.1" fill="#fff"/></svg>Diary</button>
  <button data-tab="coach"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="2.5" y="4" width="19" height="15" rx="3.5"/><path d="M6 15l4-4 3 2.5L18 8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Coach</button>
  <button data-tab="me"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="7.5" r="4.5"/><path d="M3.5 21c0-4.7 3.8-8 8.5-8s8.5 3.3 8.5 8z"/></svg>Me</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.3 2h3.4l.6 2.6 1.7.8 2.3-1.4 2.4 2.4-1.4 2.3.8 1.7 2.6.6v3.4l-2.6.6-.8 1.7 1.4 2.3-2.4 2.4-2.3-1.4-1.7.8-.6 2.6h-3.4l-.6-2.6-1.7-.8-2.3 1.4-2.4-2.4 1.4-2.3-.8-1.7L2 13.7v-3.4l2.6-.6.8-1.7L4 5.7l2.4-2.4 2.3 1.4 1.7-.8z"/><circle cx="12" cy="12" r="3.6" fill="#fff"/></svg>Settings</button>
</div></nav>

<script>
/* Built-in food list. Format: name|serving|grams-or-ml per serving (blank if n/a)|kcal|protein g|carbs g|fat g|optional extras
   Extras (only where a real source exists; never invented): sat,trans,chol(mg),na=sodium(mg),fiber,sugar,addsugar,k=potassium(mg); units=N:label (serving contains N pieces)
   Values are typical averages (USDA-style / common restaurant estimates). */
const FOOD_RAW = `# Rice, noodles & grains
White rice, cooked|1 cup|158|205|4.3|44.5|0.4
Brown rice, cooked|1 cup|195|216|5|45|1.8

Congee / rice porridge (plain)|1 bowl|250|115|2.5|25|0.3
Onigiri (salmon rice ball)|1 piece|110|180|6|36|1.5
Ramen noodles, instant|1 pack (prepared)||380|8|52|15
Udon noodles, cooked|1 portion|200|210|5.2|43|0.8
Soba noodles, cooked|1 cup|114|113|5.8|24|0.1
Rice noodles / vermicelli, cooked|1 cup|176|190|3.2|42|0.4
Glass noodles, cooked|1 cup|190|190|0.2|47|0.1
Pasta, cooked|1 cup|140|220|8|43|1.3
Oatmeal, cooked with water|1 cup|234|158|6|27|3.2
Rolled oats, dry|1/2 cup|40|150|5|27|2.5
Granola|1/2 cup|60|280|6|38|12
Cornflakes cereal|1 cup|28|100|2|24|0.2
Mochi|1 piece|45|100|1.5|23|0.2
Rice cake (tteok), plain|100 g|100|230|4|50|0.5
# Bread & breakfast
White bread|1 slice|28|75|2.5|14|1
Whole wheat bread|1 slice|32|80|4|14|1.1
Sourdough bread|1 slice|50|135|5.5|26|1
Japanese milk bread (shokupan)|1 thick slice|60|160|5|28|3
Bagel, plain|1 bagel|105|280|11|55|1.7
Croissant|1 medium|57|230|4.7|26|12
English muffin|1 muffin|57|135|4.5|26|1
Pancake|1 (6 inch)|77|175|5|22|7

  balanced:{label:'Balanced',desc:'Higher protein, ~25% fat, rest from carbs',pPerKg:1.9,fatPct:0.25},
  high_protein:{label:'High protein',desc:'Extra protein to protect muscle, ~25% fat',pPerKg:2.2,fatPct:0.25},
  low_carb:{label:'Low carb',desc:'Carbs ~20% of calories, more fat',pPerKg:1.9,carbPct:0.20},

  keto:{label:'Keto',desc:'About 25 g carbs, mostly fat',pPerKg:1.6,carbG:25}
};
function bmrMifflin(sex,kg,cm,age){return 10*kg+6.25*cm-5*age+(sex==='male'?5:-161)}

function calcSuggestion(p,kg){

  const bmr=bmrMifflin(p.sex,kg,p.heightCm,p.age);

  const losing=kg-p.goalKg>0.05;

  let target=Math.round((tdee-deficit)/10)*10;

  const d=DIETS[dietKey]||DIETS.balanced;

  if(d.carbG!=null){c=d.carbG;f=(kcal-p*4-c*4)/9}

  if(!(kgPerWeek>0)) return{weeks:null,date:null};

function weightTrend(weights){ // weights sorted asc [{date,kg}] → kg lost per week (positive=loss), via least squares over last 28 days
  if(weights.length<2) return null;
  const last=weights[weights.length-1];
  let pts=weights.filter(w=>isoDiff(w.date,last.date)<=28);
  if(pts.length<2) pts=weights.slice(-2);
  const span=isoDiff(pts[0].date,last.date);

    out.push({id:'b_'+p[0].toLowerCase().replace(/[^a-z0-9]+/g,'_'),name:p[0],serving:p[1],grams,unitType,kcal:+p[3],p:+p[4],c:+p[5],f:+p[6],n,units,cat,brand});
  });
  return out;
}
const FOODS=parseFoods(FOOD_RAW);
const CATS=[...new Set(FOODS.map(f=>f.cat))];
function allFoods(){return state.customFoods.map(f=>({...f,cat:'My foods',custom:true})).concat(FOODS)}
function searchFoods(q){
  const toks=q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!toks.length) return[];
  const res=[];
  allFoods().forEach(f=>{
    const n=f.name.toLowerCase(),hay=n+' '+(f.brand||'').toLowerCase()+' '+f.cat.toLowerCase();
    if(!toks.every(t=>hay.includes(t))) return;
    let score=n.startsWith(toks[0])?0:(new RegExp('\\b'+toks[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(n)?1:2);
    if(f.custom) score-=0.5;
    res.push({f,score:score+n.length/200});
  });
  return res.sort((a,b)=>a.score-b.score).slice(0,60).map(r=>r.f);
}
function recentFoods(limit=15){
  const map=new Map();const today=todayISO();
  Object.keys(state.days).sort().forEach(date=>{
    Object.values(state.days[date]).flat().forEach(e=>{
      const key=e.foodId||('q:'+e.name.toLowerCase());
      const r=map.get(key)||{count:0,last:date,e};
      r.count++;r.last=date;r.e=e;map.set(key,r);
    });
  });
  return[...map.values()].map(r=>({...r,score:r.count+Math.max(0,14-isoDiff(r.last,today))/2})).sort((a,b)=>b.score-a.score).slice(0,limit);
}
function foodFromEntry(e){return{id:e.foodId||null,name:e.name,brand:e.brand||'',serving:e.serving,grams:e.grams,unitType:e.unitType,units:e.units||null,kcal:e.per.kcal,p:e.per.p,c:e.per.c,f:e.per.f,n:{...((e.per&&e.per.n)||{})},quick:!!e.quick}}
function liveFood(e){ // prefer the current definition of a food (e.g. corrected built-in values) when re-logging
  const f=e.foodId&&allFoods().find(x=>x.id===e.foodId);return f||foodFromEntry(e);
}

}

/* ---------- Coach ---------- */
function renderCoach(){
  const p=P(),t=targets(),u=U(),kg=currentKg();
  const start=p.startKg,goal=p.goalKg;
  const losing=start-goal>0.05;
  const pct=losing?clamp((start-kg)/(start-goal),0,1):1;
  const est=goalEstimate();
  const today=todayISO();
  const sinceCI=isoDiff(p.lastCheckin||p.startDate,today);
  const periodEnd=addDays(today,-1);
  const periodLabel=sinceCI<=0?'Started today':`${fmtMD(p.lastCheckin)} - ${fmtMD(periodEnd)}`;
  const due=sinceCI>=7;
  // compliance
  const inc=state.prefs.includeToday;
  const cEnd=inc?today:periodEnd;
  const days=[];
  for(let d=p.lastCheckin;d<=cEnd;d=addDays(d,1)){if(isLogged(d))days.push(dayTotals(d));if(days.length>400)break}
  const avg=k=>days.length?days.reduce((a,x)=>a+x[k],0)/days.length:null;
  const crow=(n,k,unit)=>{const[lo,hi]=targetRange(t[k]),a=avg(k),inR=a!=null&&a>=lo&&a<=hi;return`<div>${n}</div><div class="r">${lo}-${hi}${unit}</div><div class="r"><b class="${inR?'in':''}">${a==null?'—':Math.round(a)+unit}</b></div>`};
  return`<div class="hero coach-hero">
    <div class="goal-t">${losing?'Fat loss':'Maintenance'}</div>
    <div class="rate">${losing?'-':''}${fmtRate(p.rateKg)} <small>${wu()}/week</small></div>
    <div class="progress"><i style="width:${(pct*100).toFixed(1)}%"></i></div>
    <div class="sce">
      <div><b>${fmtW(start)} <small>${wu()}</small></b><span>Start</span></div>
      <div><b>${fmtW(kg)} <small>${wu()}</small></b><span>Current</span></div>
      <div><b>${fmtW(goal)} <small>${wu()}</small></b><span>End ✎</span></div>
    </div>
    <div class="two">
      <button class="btn-pill" data-act="change-goal"><svg class="ic" viewBox="0 0 24 24" fill="var(--blue)"><path d="M3 17.2V21h3.8l11-11-3.8-3.8zM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.8 3.8z"/></svg>Change goal</button>
      <button class="btn-pill" data-act="add-weight"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--blue)"/><path d="M12 7v10M7 12h10" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>Add weight</button>
    </div>
    ${est.date&&losing?`<div class="muted tiny" style="margin-top:12px">At this pace, estimated to reach ${fmtW(goal)} ${wu()} around <b>${fmtMDY(est.date)}</b></div>`:''}
  </div>
  <div class="card">
    <div class="flex between"><h2 style="margin:0">Tracking period</h2><b class="small">${periodLabel}</b></div>
    <p class="muted small" style="margin:4px 0 14px">${due?"It's been a while since your last check-in.":sinceCI<=0?'Check in once a week with your weight.':`Next check-in in ${7-sinceCI} day${7-sinceCI===1?'':'s'}.`}</p>

    <div class="macro-grid">
      <div><b>${fmtN(t.kcal)}</b><span>Cal</span></div>
      <div><b><i class="dot" style="background:var(--p)"></i>${Math.round(t.p)}</b><span>Protein (g)</span></div>
      <div><b><i class="dot" style="background:var(--c)"></i>${Math.round(t.c)}</b><span>Carbs (g)</span></div>
      <div><b><i class="dot" style="background:var(--f)"></i>${Math.round(t.f)}</b><span>Fat (g)</span></div>
    </div>
    <div class="flex between"><span class="small"><b>Diet:</b> ${DIETS[p.diet]?DIETS[p.diet].label:'Balanced'}${t.manual?' · custom':''}</span>
      <button class="btn-pill btn-sm" data-act="adjust"><svg class="ic" viewBox="0 0 24 24" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" fill="none"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Adjust</button></div>
    ${t.belowFloor?`<div class="note warm">${fmtN(t.kcal)} Cal is below the usual ${fmtN(floorFor(p.sex))} Cal minimum. Totally your call — it may be worth a quick chat with a doctor or dietitian if you plan to stay this low.</div>`:''}
    ${!t.manual&&t.s&&t.s.floored?`<div class="note">Held at the ${t.s.floor} Cal minimum, so progress may be a little slower than ${fmtRate(p.rateKg)} ${wu()}/week.</div>`:''}
  </div>
  <div class="card">
    <div class="flex between"><h2 style="margin:0">Compliance</h2><span class="flex small">Include today ${sw('incToday',inc,'inc-today')}</span></div>
    <div class="ctable">
      <div class="hd">${fmtMD(p.lastCheckin)} - ${fmtMD(cEnd<p.lastCheckin?p.lastCheckin:cEnd)}</div><div class="hd r">Targets</div><div class="hd r">Tracked (Avg)</div>
      ${crow('Cal','kcal','')}${crow('Protein','p','g')}${crow('Carbs','c','g')}${crow('Fat','f','g')}
    </div>
    <p class="muted tiny" style="margin:12px 0 0">Average of ${days.length} logged day${days.length===1?'':'s'} this period. Targets show a ±3% range.</p>
  </div>
  <p class="disclaimer">Not medical advice.</p>`;
}

/* ---------- Me (weight + history) ---------- */
function renderMe(){
  const p=P(),u=U(),ws=sortedWeights(),kg=currentKg();
  const lost=p.startKg-kg,remaining=Math.max(0,kg-p.goalKg);
  const span=p.startKg-p.goalKg;
  const pct=span>0?clamp(lost/span,0,1)*100:100;
  const tr=weightTrend(ws);
  // history
  const end=todayISO(),range=ui.trendRange;
  const days=[];for(let i=range-1;i>=0;i--){const d=addDays(end,-i);days.push({d,t:dayTotals(d),logged:isLogged(d)})}
  const avgOf=n=>{const L=[];for(let i=0;i<n;i++){const d=addDays(end,-i);if(isLogged(d))L.push(dayTotals(d).kcal)}return L.length?{avg:L.reduce((a,b)=>a+b)/L.length,n:L.length}:null};
  const a7=avgOf(7),a30=avgOf(30),T=targets().kcal;
  let streak=0,cur=isLogged(end)?end:addDays(end,-1);while(isLogged(cur)&&streak<3650){streak++;cur=addDays(cur,-1)}
  let trendTxt='';
  if(tr){
    const r=tr.lossPerWeek;
    if(r>0) trendTxt=`Losing about <b>${fmtRate(r)} ${wu()}/week</b> (last ${Math.min(28,tr.span)} days).`;
    else trendTxt=`About <b>${fmtRate(Math.abs(r))} ${wu()}/week</b> ${Math.abs(r)<0.05?'— holding steady':'up'} (last ${Math.min(28,tr.span)} days). Weight naturally bounces around day to day; the trend matters most.`;
  }
  return`<div class="page-title">Me</div>
  <div class="card">
    <div class="grid3">
      <div><div class="lbl">Lost so far</div><div class="big-num">${fmtW(Math.max(0,lost))}</div><div class="muted tiny">${wu()}${lost<0?` (up ${fmtW(-lost)})`:''}</div></div>
      <div><div class="lbl">To go</div><div class="big-num">${fmtW(remaining)}</div><div class="muted tiny">${wu()}</div></div>
      <div><div class="lbl">Done</div><div class="big-num">${Math.round(pct)}%</div><div class="muted tiny">of goal</div></div>
    </div>
    <div class="progress" style="margin:14px 0 6px"><i style="width:${pct.toFixed(1)}%"></i></div>
    ${trendTxt?`<p class="small" style="margin:10px 0 0">${trendTxt}</p>`:`<p class="muted small" style="margin:10px 0 0">Log weigh-ins over at least a week to see your weekly rate.</p>`}
    ${tr&&tr.pctPerWeek>1?`<div class="note warm">That's faster than ~1% of body weight per week. A slower pace is easier to keep up and helps protect muscle — consider eating a bit more.</div>`:''}
  </div>
  <div class="card white"><div class="flex between"><h2 style="margin:0">Weight</h2><button class="btn-soft btn-sm" data-act="add-weight">+ Add weight</button></div>
    ${weightChart(ws,p.goalKg)}
  </div>
  <div class="card white">
    <div class="seg"><button type="button" data-act="trange" data-v="7" class="${range===7?'on':''}">Last 7 days</button><button type="button" data-act="trange" data-v="30" class="${range===30?'on':''}">Last 30 days</button></div>
    <div class="grid3" style="margin-bottom:10px">
      <div style="background:var(--card)"><div class="lbl">7-day avg</div><div class="big-num">${a7?fmtN(a7.avg):'—'}</div><div class="muted tiny">Cal · ${a7?a7.n:0} days</div></div>
      <div style="background:var(--card)"><div class="lbl">30-day avg</div><div class="big-num">${a30?fmtN(a30.avg):'—'}</div><div class="muted tiny">Cal · ${a30?a30.n:0} days</div></div>
      <div style="background:var(--card)"><div class="lbl">Streak</div><div class="big-num">${streak}</div><div class="muted tiny">day${streak===1?'':'s'} logged</div></div>
    </div>
    ${calorieBars(days,T)}
    <p class="muted tiny" style="margin:6px 0 0">Target ${fmtN(T)} Cal (dashed). Averages count logged days only.</p>
  </div>
  <div class="card white"><h2>Weigh-ins</h2>
    <div class="list">${ws.length?[...ws].reverse().map(w=>`<div class="item" style="cursor:default"><div class="in"><div>${fmtMDY(w.date)}</div></div><div class="k">${fmtW(w.kg)} ${wu()}</div><button class="btn-ghost btn-sm" data-act="del-weight" data-date="${w.date}" aria-label="Delete">✕</button></div>`).join(''):'<p class="muted small">No weigh-ins yet.</p>'}</div>
  </div>`;
}
function weightChart(ws,goalKg){
  if(!ws.length) return'<p class="muted small">No weigh-ins yet.</p>';
  const W=340,H=180,pl=34,pr=10,pt=14,pb=24;
  const xs=ws.map(w=>parseISO(w.date).getTime());
  let x0=xs[0],x1=xs[xs.length-1];if(x1-x0<864e5*6){x0-=864e5*3;x1+=864e5*3}
  const vals=ws.map(w=>kgToU(w.kg)).concat([kgToU(goalKg)]);
  let lo=Math.min(...vals),hi=Math.max(...vals);const padv=Math.max(1,(hi-lo)*0.12);lo=Math.floor(lo-padv);hi=Math.ceil(hi+padv);
  const X=t=>pl+(t-x0)/(x1-x0)*(W-pl-pr),Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  const ticks=[];const step=Math.max(1,Math.ceil((hi-lo)/4));for(let v=Math.ceil(lo);v<=hi;v+=step)ticks.push(v);
  const pts=ws.map((w,i)=>[X(xs[i]),Y(kgToU(w.kg))]);
  const g=Y(kgToU(goalKg));
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight chart">
    ${ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#edf1f7"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join('')}
    <line x1="${pl}" x2="${W-pr}" y1="${g}" y2="${g}" stroke="var(--f)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${W-pr}" y="${g-5}" text-anchor="end" style="fill:var(--f)">Goal ${fmtW(goalKg)}</text>
    ${pts.length>1?`<polyline points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:''}
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="#fff" stroke="var(--blue)" stroke-width="2"/>`).join('')}
    <text x="${pl}" y="${H-6}">${fmtMD(ws[0].date)}</text>${ws.length>1?`<text x="${W-pr}" y="${H-6}" text-anchor="end">${fmtMD(ws[ws.length-1].date)}</text>`:''}
  </svg>`;
}
function calorieBars(days,target){
  const W=340,H=150,pl=6,pr=6,pt=10,pb=20,n=days.length,gap=n>7?2:8;
  const max=Math.max(target*1.25,...days.map(d=>d.t.kcal),1);
  const bw=(W-pl-pr-gap*(n-1))/n,Y=v=>pt+(1-v/max)*(H-pt-pb);
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories per day">
    ${days.map((d,i)=>{const x=pl+i*(bw+gap),h=d.logged?Math.max(2,(d.t.kcal/max)*(H-pt-pb)):3;
      const col=!d.logged?'#e3eaf4':(d.t.kcal>target*1.05?'var(--c)':'var(--blue)');
      const lab=n<=7?parseISO(d.d).toLocaleDateString('en-US',{weekday:'short'}):((n-1-i)%7===0?fmtMD(d.d):'');
      return`<rect x="${x.toFixed(1)}" y="${(H-pb-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${n>7?2:5}" fill="${col}"><title>${d.d}: ${Math.round(d.t.kcal)} Cal</title></rect>${lab?`<text x="${(x+bw/2).toFixed(1)}" y="${H-5}" text-anchor="middle">${lab}</text>`:''}`}).join('')}
    <line x1="${pl}" x2="${W-pr}" y1="${Y(target)}" y2="${Y(target)}" stroke="var(--ink)" stroke-opacity=".45" stroke-dasharray="4 4"/>
  </svg>`;
}

    <button data-act="clear-all" style="color:var(--danger)">${gi('#fcebea','🗑️')}<span class="gt">Clear all data…</span></button>
  </div>
  <div class="sec-t">Help &amp; info</div>

<script>
/* ================= ADD FOOD SHEET ================= */
function openAdd(mealId,tab){
  ui.addMeal=mealId;ui.addTab=tab||'search';ui.q='';ui.cat=null;
  showAdd();
}
function showAdd(){
  openSheet(`Add to ${mealName(ui.addMeal)}`,`<div class="seg" id="addTabs">
    <button type="button" data-act="add-tab" data-v="search" class="${ui.addTab==='search'?'on':''}">Search</button>
    <button type="button" data-act="add-tab" data-v="mine" class="${ui.addTab==='mine'?'on':''}">My foods</button>
    <button type="button" data-act="add-tab" data-v="quick" class="${ui.addTab==='quick'?'on':''}">Quick add</button></div><div id="addBody"></div>`,{mount:renderAddBody});
}
function servingText(f){return f.serving+(f.grams&&!isAmountServing(f)?` (${fmtG(f.grams)} ${f.unitType})`:'')}
function foodItem(f,attrs,sub){
  return`<div class="item" ${attrs}><div class="in"><div>${esc(f.name)}${f.brand?` <span class="muted tiny" style="font-weight:500">· ${esc(f.brand)}</span>`:''}${f.custom?' <span class="badge">My food</span>':''}</div><div class="muted tiny">${esc(sub||servingText(f))} · ${fmtG(f.p)}p ${fmtG(f.c)}c ${fmtG(f.f)}f</div></div><div class="k">${fmtN(f.kcal)}<div class="muted tiny" style="font-weight:500">Cal</div></div></div>`;
}
function savedMealItem(m,attrs){
  const t=sumEntries(m.items);
  return`<div class="item" ${attrs}><div class="in"><div>🍱 ${esc(m.name)} <span class="badge">Meal</span></div><div class="muted tiny">${m.items.length} item${m.items.length===1?'':'s'} · ${fmtG(t.p)}p ${fmtG(t.c)}c ${fmtG(t.f)}f · tap to log all</div></div><div class="k">${fmtN(t.kcal)}<div class="muted tiny" style="font-weight:500">Cal</div></div></div>`;
}
function renderAddBody(){
  const b=$('#addBody');if(!b)return;
  if(ui.addTab==='search'){
    b.innerHTML=`<input id="foodQ" type="search" placeholder="Search foods (e.g. spam, latte, pho)" value="${esc(ui.q)}" autocomplete="off"><div id="results" class="list"></div>`;
    const q=$('#foodQ');q.oninput=()=>{ui.q=q.value;renderResults()};
    renderResults();
  }else if(ui.addTab==='mine'){
    b.innerHTML=myFoodsHTML(true);
  }else{
    b.innerHTML=quickForm(null);
  }
}
function myFoodsHTML(inAdd){
  const cf=state.customFoods,sm=state.savedMeals;
  return`<button class="btn-soft btn-block" data-act="${inAdd?'custom-new':'custom-new-settings'}">+ New custom food</button>
    <div class="section-t">Saved meals</div>
    <div class="list">${sm.length?sm.map(m=>`<div class="flex"><div style="flex:1;min-width:0">${savedMealItem(m,inAdd?`data-act="saved-log" data-id="${m.id}"`:`data-act="saved-open" data-id="${m.id}"`)}</div>${inAdd?`<button class="btn-ghost btn-sm" data-act="saved-open" data-id="${m.id}">Edit</button>`:''}</div>`).join(''):'<p class="muted small">No saved meals yet. Use a meal’s ⋯ menu → “Save as meal” to reuse a whole meal in one tap.</p>'}</div>
    <div class="section-t">Custom foods</div>
    <div class="list">${cf.length?cf.map(f=>`<div class="flex"><div style="flex:1;min-width:0">${foodItem({...f,custom:false},inAdd?`data-act="pick" data-src="food" data-id="${f.id}"`:`data-act="custom-edit-settings" data-id="${f.id}"`)}</div>${inAdd?`<button class="btn-ghost btn-sm" data-act="custom-edit" data-id="${f.id}">Edit</button>`:''}</div>`).join(''):'<p class="muted small">No custom foods yet. Add things like your favourite café order, a packaged snack from its label, or a home recipe.</p>'}</div>`;
}
function renderResults(){
  const r=$('#results');if(!r)return;
  const q=ui.q.trim();
  if(q){
    const res=searchFoods(q),ql=q.toLowerCase();
    const mine=res.filter(f=>f.custom),rest=res.filter(f=>!f.custom);
    const meals=state.savedMeals.filter(m=>m.name.toLowerCase().includes(ql));

    if(rest.length) h+=`<div class="section-t">All foods</div>`+rest.map(f=>foodItem(f,`data-act="pick" data-src="food" data-id="${f.id}"`)).join('');
    h+=`<div style="padding:14px 0" class="center"><p class="muted small" style="margin:0 0 8px">${res.length?'Not quite right?':'No matches.'}</p><button class="btn-soft btn-sm" data-act="custom-new" data-name="${esc(q)}">Create “${esc(q)}” as a custom food</button></div>`;
    r.innerHTML=h;
    return;
  }
  const rec=recentFoods();ui.recentCache=rec;
  let h='';
  if(state.savedMeals.length||state.customFoods.length){
    h+=`<div class="section-t flex between"><span>My foods</span><button class="btn-ghost btn-sm" data-act="add-tab" data-v="mine" style="padding:2px 4px;text-transform:none;letter-spacing:0">See all ›</button></div>`;
    h+=state.savedMeals.slice(0,3).map(m=>savedMealItem(m,`data-act="saved-log" data-id="${m.id}"`)).join('');
    h+=state.customFoods.slice(0,5).map(f=>foodItem(f,`data-act="pick" data-src="food" data-id="${f.id}"`)).join('');
  }
  if(rec.length) h+=`<div class="section-t">Recent &amp; frequent</div>`+rec.map((x,i)=>foodItem({...foodFromEntry(x.e),kcal:x.e.kcal,p:x.e.p,c:x.e.c,f:x.e.f},`data-act="pick" data-src="recent" data-i="${i}"`,`${entryDetail(x.e)} · logged ${x.count}×`)).join('');
  h+=`<div class="section-t">Browse</div><div class="chips">${CATS.map(c=>`<button type="button" class="chip ${ui.cat===c?'on':''}" data-act="cat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
  if(ui.cat) h+=FOODS.filter(f=>f.cat===ui.cat).map(f=>foodItem(f,`data-act="pick" data-src="food" data-id="${f.id}"`)).join('');
  else if(!rec.length) h+=`<p class="muted small">Type to search ${FOODS.length}+ everyday foods — Western and Asian dishes, drinks, boba, coffee and more.</p>`;
  r.innerHTML=h;
}

/* ---------- Portion ---------- */
function isAmountServing(f){return!!(f.grams&&/^\s*\d+(\.\d+)?\s*(g|ml)\s*$/i.test(f.serving||''))}
function defaultPortion(f){return isAmountServing(f)?{mode:'grams',qty:f.grams}:{mode:'serving',qty:1}}
function openPortion(food,o){
  const d=defaultPortion(food);
  ui.portion={food,mode:o.mode||d.mode,qty:o.qty!=null?+o.qty:d.qty,meal:o.meal,editId:o.editId||null,origMeal:o.meal,back:!!o.back};
  if(ui.portion.mode==='grams'&&!food.grams) ui.portion.mode='serving';
  if(ui.portion.mode==='unit'&&!food.units) ui.portion.mode='serving';
  const f=food;
  const modes=[['serving','Servings']];
  if(f.units) modes.push(['unit',cap(f.units.label)]);
  if(f.grams) modes.push(['grams',f.unitType==='ml'?'Millilitres':'Grams']);
  openSheet(o.editId?'Edit entry':'Add food',`
    <h3>${esc(f.name)}${f.brand?` <span class="muted small" style="font-weight:500">· ${esc(f.brand)}</span>`:''}</h3>
    <div class="muted small">Per ${esc(servingText(f))}: ${fmtN(f.kcal)} Cal · ${fmtG(f.p)}p ${fmtG(f.c)}c ${fmtG(f.f)}f</div>
    <div class="spacer"></div>
    ${modes.length>1?`<div class="seg">${modes.map(([v,l])=>`<button type="button" data-act="pmode" data-v="${v}" class="${ui.portion.mode===v?'on':''}">${esc(l)}</button>`).join('')}</div>`:''}
    <div class="qty"><button type="button" data-act="pstep" data-v="-1" aria-label="Less">−</button><input id="pq" type="number" inputmode="decimal" step="any" min="0" value="${fmtG(ui.portion.qty)}"><span class="unit" id="punit"></span><button type="button" data-act="pstep" data-v="1" aria-label="More">+</button></div>
    <div class="chips" id="pchips"></div>
    <div class="lbl">Meal</div>
    <div class="chips">${state.meals.map(m=>`<button type="button" class="chip ${m.id===ui.portion.meal?'on':''}" data-act="pmeal" data-v="${esc(m.id)}">${esc(m.name)}</button>`).join('')}</div>
    <div class="result" id="pres"></div>
    <button class="btn-primary btn-block btn-big" data-act="psave">${o.editId?'Save changes':'Add to diary'}</button>
    ${o.editId?'<button class="btn-danger btn-block" style="margin-top:10px" data-act="pdelete">Delete entry</button>':''}
    ${o.back?'<button class="btn-ghost btn-block" style="margin-top:6px" data-act="pback">‹ Back to search</button>':''}
  `,{mount:()=>{$('#pq').oninput=()=>{ui.portion.qty=+$('#pq').value||0;updPortion(false)};updPortion(false)}});
}
const cap=s=>String(s||'').charAt(0).toUpperCase()+String(s||'').slice(1);
function updPortion(setInput=true){
  const pt=ui.portion,f=pt.food;
  if(setInput) $('#pq').value=fmtG(pt.qty);
  $('#punit').textContent=pt.mode==='grams'?(f.unitType==='ml'?'ml':'g'):pt.mode==='unit'?f.units.label:(pt.qty===1?'serving':'servings');
  const chips=pt.mode==='grams'?[50,100,150,200,250]:pt.mode==='unit'?[1,2,3,4,6]:[0.5,1,1.5,2,3];
  const suf=pt.mode==='grams'?(f.unitType==='ml'?' ml':' g'):pt.mode==='unit'?' '+f.units.label:'×';

    {mount:()=>{const sb=$('#sheetBody');sb.oninput=updCustomLabel;updCustomLabel();if(!food)$('#cfName').focus()}});

function readCustomLabel(){
  const num=id=>{const s=$('#'+id).value;return s===''?null:+s};
  return{p:num('cfP'),c:num('cfC'),f:num('cfF'),kcal:num('cfK'),
    n:{satFat:num('cfSat'),transFat:num('cfTrans'),cholesterol:num('cfChol'),sodium:num('cfNa'),fiber:num('cfFiber'),sugars:num('cfSugar'),addedSugars:num('cfAdded'),potassium:num('cfK2')}};
}
function macroCal(p,c,f){return(p||0)*4+(c||0)*4+(f||0)*9}
function updCustomLabel(){
  const r=readCustomLabel();
  const mc=Math.round(macroCal(r.p,r.c,r.f));
  $('#cfK').placeholder=mc>0?`≈ ${mc}`:'auto';
  const vals={f:r.f,c:r.c,p:r.p,...r.n};
  $$('#nfLabel [data-dv]').forEach(el=>{const k=el.dataset.dv;el.textContent=k&&vals[k]!=null&&LABEL_DV[k]?Math.round(vals[k]/LABEL_DV[k]*100)+'%':''});
  let w='';
  const hasMac=r.p!=null||r.c!=null||r.f!=null;
  if(r.kcal==null&&mc>0) w=`<div class="note">Calories left blank — will use <b>${mc} Cal</b> calculated from macros (4/4/9).</div>`;
  else if(r.kcal!=null&&hasMac&&mc>0&&Math.abs(r.kcal-mc)/Math.max(r.kcal,mc)>0.2) w=`<div class="note warm">Calories (${fmtN(r.kcal)}) differ from what the macros add up to (≈${mc} Cal) by more than 20%. Double-check the label — it's fine to save if the label really says so.</div>`;
  $('#cfWarn').innerHTML=w;
}
function customFromForm(id){
  const name=$('#cfName').value.trim();

function openNutrients(){
  const date=ui.date,entries=Object.values(dayRead(date)).flat(),tot=sumEntries(entries),t=targets();

  const label=date===todayISO()?'Today':fmtMD(date);
  const macroRow=(n,k,col,unit)=>{const pct=t[k]>0?tot[k]/t[k]*100:0;return`<div class="nrow"><div class="nl"><span>${n}</span><b>${k==='kcal'?fmtN(tot[k]):fmtG(tot[k])}${unit} <span class="muted" style="font-weight:500">/ ${fmtN(t[k])}${unit}</span></b></div><div class="nbar"><i style="width:${clamp(pct,0,100)}%;background:${col}"></i></div></div>`};
  let missingAny=false;
  const rows=NUTS.map(n=>{
    const x=nt[n.k],pct=n.dv?x.sum/n.dv*100:null;
    if(x.missing&&entries.length) missingAny=true;
    const status=!entries.length?'':x.have===0?`<span class="muted tiny">No data</span>`:x.missing?`<span class="muted tiny">${x.missing} of ${entries.length} foods have no data</span>`:'';
    return`<div class="nrow"><div class="nl"><span>${n.label}</span><b>${x.have?fmtNut(x.sum,n.unit):'—'}${n.dv?` <span class="muted" style="font-weight:500">/ ${fmtN(n.dv)} ${n.unit}</span>`:''}</b></div>
      ${n.dv?`<div class="flex" style="gap:8px"><div class="nbar" style="flex:1"><i style="width:${clamp(pct,0,100)}%;background:${pct>100&&n.limit?'var(--warm)':'var(--blue)'}"></i></div><span class="tiny" style="width:40px;text-align:right;font-weight:700">${x.have?Math.round(pct)+'%':''}</span></div>`:''}
      ${status?`<div>${status}</div>`:''}</div>`;
  }).join('');
  openSheet(`Nutrients · ${label}`,`
    <div class="section-t" style="margin-top:0">Macros vs your targets</div>
    ${macroRow('Calories','kcal','var(--cal)','')}${macroRow('Protein','p','var(--p)','g')}${macroRow('Carbs','c','var(--c)','g')}${macroRow('Fat','f','var(--f)','g')}
    <div class="section-t">Other nutrients <span style="text-transform:none;letter-spacing:0;font-weight:500">· % of FDA Daily Value</span></div>

    <p class="muted tiny">Daily Values: sodium 2,300 mg · saturated fat 20 g · fiber 28 g · added sugars 50 g · cholesterol 300 mg · potassium 4,700 mg. Sodium, saturated fat, added sugars and cholesterol are “aim for less than”; fiber and potassium are “aim for at least”.</p>`);
}

  P().goalKg=uToKg(g);P().rateKg=uToKg(r);
  save();closeSheet();render();toast('Goal updated. '+(targetChangeMsg(before)||''));
}
function openAdjust(){
  const p=P(),t=targets(),m=p.manual||{on:false};
  const auto=t.auto;
  const val=(k)=>m.on?m[k==='kcal'?'kcal':k]:(auto?auto[k]:'');
  openSheet('Macro targets',`
    <label class="field"><span>Diet type</span><select id="aDiet">${Object.entries(DIETS).map(([k,v])=>`<option value="${k}" ${k===p.diet?'selected':''}>${v.label} — ${v.desc}</option>`).join('')}</select></label>
    <div class="result" id="aSug"></div>
    <div class="flex between" style="margin:6px 0 10px"><b>Use custom targets</b>${sw('aOn',m.on)}</div>
    <div id="aBox">
      <div class="row"><label class="field"><span>Calories</span><input id="aK" type="number" inputmode="numeric" value="${val('kcal')}"></label>
      <label class="field"><span>Protein g</span><input id="aP" type="number" inputmode="numeric" value="${val('p')}"></label></div>
      <div class="row"><label class="field"><span>Carbs g</span><input id="aC" type="number" inputmode="numeric" value="${val('c')}"></label>
      <label class="field"><span>Fat g</span><input id="aF" type="number" inputmode="numeric" value="${val('f')}"></label></div>
      <div class="muted tiny" id="aMath"></div>
      <button class="btn-ghost btn-sm" data-act="adjust-fill">Fill in the suggestion</button>
      <div id="aNote"></div>
    </div>
    <button class="btn-primary btn-block btn-big" style="margin-top:12px" data-act="adjust-save">Save targets</button>`,{mount:()=>{
      const upd=()=>{
        const diet=$('#aDiet').value,s=suggestion(),on=$('#aOn').checked;
        const mac=s?macrosFor(s.target,currentKg(),diet):null;
        $('#aSug').innerHTML=s?`<div class="kv"><span>Suggested (${DIETS[diet].label})</span><b>${fmtN(s.target)} Cal</b></div><div class="kv"><span>Protein · Carbs · Fat</span><span>${mac.p}g · ${mac.c}g · ${mac.f}g</span></div><div class="kv"><span>Maintenance (TDEE)</span><span>${fmtN(s.tdee)} Cal</span></div>${s.floored?`<div class="note" style="margin-bottom:0">Suggestion held at the ${s.floor} Cal minimum.</div>`:''}`:'<span class="muted small">Add age &amp; height in Profile to get a suggestion.</span>';
        $('#aBox').style.display=on?'':'none';
        const K=+$('#aK').value,pp=+$('#aP').value,cc=+$('#aC').value,ff=+$('#aF').value;
        const fromMac=Math.round(pp*4+cc*4+ff*9);
        $('#aMath').textContent=`Macros add up to ${fmtN(fromMac)} Cal${K&&Math.abs(fromMac-K)>K*0.05?' — a bit different from your calorie target, that\'s fine':''}.`;
        $('#aNote').innerHTML=on&&K&&K<floorFor(p.sex)?`<div class="note warm">${fmtN(K)} Cal is below the usual ${fmtN(floorFor(p.sex))} Cal minimum. Your choice — just worth checking with a doctor or dietitian if you'll stay this low for long.</div>`:'';
      };
      $('#sheetBody').oninput=upd;$('#sheetBody').onchange=upd;upd();
    }});
}
function adjustFill(){
  const s=suggestion();if(!s){toast('Add age & height in Profile first');return}
  const mac=macrosFor(s.target,currentKg(),$('#aDiet').value);
  $('#aK').value=s.target;$('#aP').value=mac.p;$('#aC').value=mac.c;$('#aF').value=mac.f;
  $('#sheetBody').dispatchEvent(new Event('input'));
}
function adjustSave(){
  const p=P(),on=$('#aOn').checked;
  p.diet=$('#aDiet').value;
  if(on){
    const K=+$('#aK').value;if(!(K>0)){toast('Enter a calorie target');return}
    p.manual={on:true,kcal:K,p:+$('#aP').value||0,c:+$('#aC').value||0,f:+$('#aF').value||0};
  }else p.manual={...(p.manual||{}),on:false};
  save();closeSheet();render();toast(`Targets saved: ${fmtN(targets().kcal)} Cal`);
}

/* ---------- Data ---------- */
function download(name,text,type){
  const blob=new Blob([text],{type});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
const csvCell=v=>{const s=String(v??'');return/[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
function exportJSON(){download(`plate-backup-${todayISO()}.json`,JSON.stringify({app:'plate',exported:new Date().toISOString(),...state},null,2),'application/json');toast('Backup downloaded')}
function exportCSV(){
  const rows=[['date','meal','food','brand','amount','calories','protein_g','carbs_g','fat_g',...NUTS.map(n=>n.k.replace(/[A-Z]/g,c=>'_'+c.toLowerCase())+'_'+n.unit)]];
  Object.keys(state.days).sort().forEach(d=>Object.entries(state.days[d]).forEach(([m,l])=>(l||[]).forEach(e=>rows.push([d,mealName(m),e.name,e.brand||'',entryDetail(e),Math.round(e.kcal),e.p,e.c,e.f,...NUTS.map(n=>e.n&&e.n[n.k]!=null?e.n[n.k]:'')]))));
  download(`plate-food-log-${todayISO()}.csv`,rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv');
  const wr=[['date','weight_kg','weight_lb']].concat(sortedWeights().map(w=>[w.date,round(w.kg,2),round(w.kg/LB_KG,1)]));
  setTimeout(()=>download(`plate-weights-${todayISO()}.csv`,wr.map(r=>r.join(',')).join('\n'),'text/csv'),400);
  toast('CSV files downloaded');
}
function importFile(file){
  const rd=new FileReader();
  rd.onload=()=>{
    let data;try{data=JSON.parse(rd.result)}catch(e){toast('That file isn’t valid JSON');return}
    if(!data||!data.profile||typeof data.days!=='object'){toast('Not a Plate backup file');return}
    if(data.version>SCHEMA){toast('This backup is from a newer version of Plate');return}
    ui.pendingImport=data;
    const nDays=Object.keys(data.days||{}).length,nW=(data.weights||[]).length;
    openSheet('Import backup?',`<p>This backup has <b>${nDays}</b> day${nDays===1?'':'s'} of food logs and <b>${nW}</b> weigh-in${nW===1?'':'s'}.</p><p class="muted small">Importing replaces everything currently in this app.</p>
      <button class="btn-primary btn-block btn-big" data-act="import-confirm">Replace my data</button><button class="btn-ghost btn-block" data-act="close-sheet">Cancel</button>`,{auto:true});
  };
  rd.readAsText(file);
}
function openClear(){
  openSheet('Clear all data?',`<p>This permanently deletes your food log, weigh-ins, custom foods and settings from this browser.</p><p class="muted small">Tip: export a backup first.</p>
    <button class="btn-soft btn-block" data-act="export-json">Export backup first</button><div class="spacer"></div>
    <button class="btn-danger btn-block btn-big" data-act="clear-confirm">Yes, delete everything</button><button class="btn-ghost btn-block" data-act="close-sheet">Cancel</button>`,{auto:true});
}

const A={
  'close-sheet':()=>closeSheet(),
  'setup-save':()=>setupSave(),
  day:el=>{const n=addDays(ui.date,+el.dataset.d);if(n<=todayISO()){ui.date=n;render()}},
  mode:el=>{state.prefs.diaryMode=el.dataset.v;save();render()},
  trange:el=>{ui.trendRange=+el.dataset.v;render()},
  add:el=>openAdd(el.dataset.meal),
  'add-tab':el=>{ui.addTab=el.dataset.v;$$('#addTabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===ui.addTab));renderAddBody()},
  cat:el=>{ui.cat=ui.cat===el.dataset.v?null:el.dataset.v;renderResults()},
  pick:el=>{
    if(el.dataset.src==='recent'){const x=ui.recentCache[+el.dataset.i];if(!x)return;const f=foodFromEntry(x.e);
      if(f.quick){ui.quickEdit=null;const per=x.e.per;const day=dayWrite(ui.date);(day[ui.addMeal]=day[ui.addMeal]||[]).push({...JSON.parse(JSON.stringify(x.e)),id:uid(),...per});save();closeSheet();render();toast(`Added ${x.e.name}`);return}
      openPortion(liveFood(x.e),{meal:ui.addMeal,mode:x.e.mode,qty:x.e.qty,back:true});return}
    const f=allFoods().find(f=>f.id===el.dataset.id);if(f)openPortion(f,{meal:ui.addMeal,back:true});
  },
  pmode:el=>{const pt=ui.portion,v=el.dataset.v,f=pt.food;if(pt.mode===v)return;const fac=portionFactor(f,pt.mode,pt.qty);pt.qty=v==='grams'?round(fac*f.grams,0):v==='unit'?round(fac*f.units.per,2):round(fac,2);pt.mode=v;$$('[data-act="pmode"]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));updPortion()},
  pstep:el=>{const pt=ui.portion,st=pt.mode==='grams'?10:pt.mode==='unit'?1:0.5;pt.qty=Math.max(0,round((pt.qty||0)+st*(+el.dataset.v),2));updPortion()},
  pqty:el=>{ui.portion.qty=+el.dataset.v;updPortion()},
  pmeal:el=>{ui.portion.meal=el.dataset.v;$$('[data-act="pmeal"]').forEach(b=>b.classList.toggle('on',b.dataset.v===el.dataset.v))},
  psave:()=>portionSave(),
  pdelete:()=>deleteEntry(ui.date,ui.portion.origMeal,ui.portion.editId),
  pback:()=>showAdd(),
  edit:el=>{
    const e=mealEntries(ui.date,el.dataset.meal).find(x=>x.id===el.dataset.id);if(!e)return;
    if(e.quick){ui.quickEdit={id:e.id,meal:el.dataset.meal};ui.addMeal=el.dataset.meal;openSheet('Edit entry',quickForm(e));return}
    openPortion(foodFromEntry(e),{meal:el.dataset.meal,mode:e.mode,qty:e.qty,editId:e.id});
  },
  'quick-save':()=>quickSave(),
  'quick-delete':()=>{const q=ui.quickEdit;ui.quickEdit=null;deleteEntry(ui.date,q.meal,q.id)},
  'custom-new':el=>openCustomForm(null,true,el.dataset.name),
  'custom-edit':el=>openCustomForm(state.customFoods.find(f=>f.id===el.dataset.id),false),
  'custom-new-settings':()=>openCustomForm(null,false),
  'custom-edit-settings':el=>openCustomForm(state.customFoods.find(f=>f.id===el.dataset.id),false),
  'custom-save':()=>customSave(),
  'custom-delete':()=>{const i=state.customFoods.findIndex(f=>f.id===ui.customCtx.id);if(i<0)return;const[f]=state.customFoods.splice(i,1);save();backToFoods();toast('Custom food deleted',()=>{state.customFoods.splice(i,0,f);save();if($('#sheet').classList.contains('show'))backToFoods()})},
  'custom-dup':()=>customDuplicate(),
  nutrients:()=>openNutrients(),
  'save-meal':el=>openSaveMeal(el.dataset.meal),
  'saved-save':()=>savedMealSave(),
  'saved-log':el=>logSavedMeal(el.dataset.id),
  'saved-open':el=>openSavedMeal(el.dataset.id),
  'saved-rename':()=>{const m=state.savedMeals.find(x=>x.id===ui.savedCtx);if(!m)return;m.name=$('#smName').value.trim()||m.name;save();toast('Saved');backToFoods()},
  'saved-delete':()=>{const i=state.savedMeals.findIndex(x=>x.id===ui.savedCtx);if(i<0)return;const[m]=state.savedMeals.splice(i,1);save();backToFoods();toast(`Deleted “${m.name}”`,()=>{state.savedMeals.splice(i,0,m);save();if($('#sheet').classList.contains('show'))backToFoods()})},
  'my-foods':()=>openMyFoods(),

  'clear-meal':el=>clearMeal(el.dataset.meal),

  adjust:()=>openAdjust(),
  'adjust-fill':()=>adjustFill(),
  'adjust-save':()=>adjustSave(),
  'set-profile':()=>openProfile(),
  'profile-save':()=>profileSave(),
  'set-coach':()=>openCoachSettings(),

  'meal-del':el=>{mealDraftSync();ui.mealDraft.splice(+el.dataset.i,1);mealRowsRender()},

  'set-app':()=>openAppPrefs(),
  'pref-mode':el=>{state.prefs.diaryMode=el.dataset.v;save();$$('[data-act="pref-mode"]').forEach(b=>b.classList.toggle('on',b.dataset.v===el.dataset.v))},
  about:()=>openAbout(),

  'clear-all':()=>openClear(),

};
document.addEventListener('click',e=>{
  const tab=e.target.closest('#nav [data-tab]');
  if(tab){ui.tab=tab.dataset.tab;if(ui.tab==='diary'&&!ui.date)ui.date=todayISO();render();window.scrollTo(0,0);return}
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el,e)}
});
document.addEventListener('change',e=>{
  const a=e.target.dataset&&e.target.dataset.change;
  if(a==='inc-today'){state.prefs.includeToday=e.target.checked;save();if(ui.tab==='coach')render()}
  if(a==='diet-pick'){const before=snapshot();P().diet=e.target.value;save();$$('.radio').forEach(r=>r.classList.toggle('on',r.querySelector('input').checked));render();const m=targetChangeMsg(before);toast('Diet: '+DIETS[e.target.value].label+(m?'. '+m:''))}
});
$('#importFile').addEventListener('change',e=>{const f=e.target.files[0];if(f)importFile(f)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeSheet();
  if(e.key==='Enter'&&e.target.id==='pq'){e.preventDefault();portionSave()}
});
// Keep "today" fresh if the app stays open past midnight
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&P())render()});

ui.date=todayISO();
render();
